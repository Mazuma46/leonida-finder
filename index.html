<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Leonida Finder: 3D-Fan-Karte für GTA 6 mit allen Easter Eggs, seltenen Autos, einzigartigen Waffen und Community-Funden – auf Deutsch.">
<meta property="og:title" content="Leonida Finder – GTA 6 Fan-Map in 3D">
<meta property="og:description" content="Alle Easter Eggs, Autos und Waffen in GTA 6 auf einer 3D-Karte. Trag deine eigenen Funde ein!">
<meta property="og:type" content="website">
<!-- Ersetze DEINE-ADRESSE durch deine echte Webadresse, damit WhatsApp/Discord das Bild finden -->
<meta property="og:image" content="https://DEINE-ADRESSE/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#12081f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Leonida Finder">
<title>Leonida Finder – GTA 6 Fan-Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff2e88;--cyan:#00e5ff;--violet:#8b5cf6;--orange:#ff8a3d;--text:#fbf6ff;--muted:#b9a9d6;
  --glass:rgba(18,9,34,.66);--glass2:rgba(40,22,70,.55);--edge:rgba(255,255,255,.10);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0616;color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden}
button{font-family:inherit}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{background:var(--glass);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--edge)}
/* Top */
.top{position:fixed;left:10px;right:10px;top:calc(10px + var(--st));border-radius:20px;padding:10px 12px 10px;z-index:3;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.brand{display:flex;align-items:center;gap:10px}
.logo{font-family:"Bebas Neue",sans-serif;font-size:30px;line-height:.9;letter-spacing:1.5px;
  background:linear-gradient(92deg,#ffd36e 0%,var(--orange) 25%,var(--pink) 55%,var(--violet) 85%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px rgba(255,46,136,.55))}
.logo small{display:block;font-family:Inter;font-size:10px;font-weight:700;letter-spacing:2.5px;-webkit-text-fill-color:var(--cyan);color:var(--cyan);filter:none;margin-top:3px;text-shadow:0 0 8px rgba(0,229,255,.7)}
.sp{flex:1}
.pill{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:7px 11px;border-radius:99px;background:var(--glass2);border:1px solid var(--edge);white-space:nowrap}
.ring{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--pink) var(--p,0%),rgba(255,255,255,.12) 0);display:grid;place-items:center}
.ring::after{content:"";width:14px;height:14px;border-radius:50%;background:#1a0d2e}
.live{width:8px;height:8px;border-radius:50%;background:#777;box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.live.on{background:#3dff9a;box-shadow:0 0 10px #3dff9a}
.live.local{background:#ffc84a;box-shadow:0 0 10px #ffc84a}
.search{margin-top:9px;position:relative}
.search input{width:100%;height:40px;border-radius:13px;border:1px solid var(--edge);background:rgba(0,0,0,.35);color:var(--text);padding:0 12px 0 36px;font-size:14px;outline:none;transition:.2s}
.search input:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,46,136,.2),0 0 18px rgba(255,46,136,.35)}
.search:before{content:"⌕";position:absolute;left:12px;top:8px;font-size:18px;color:var(--muted)}
.chips{position:fixed;left:0;right:0;top:calc(124px + var(--st));display:flex;gap:7px;overflow-x:auto;padding:4px 10px 8px;z-index:3;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;border-radius:99px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--muted);
  background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--edge);transition:.2s}
.chip b{font-weight:600;opacity:.7}
.chip.on{color:#fff;border-color:var(--c);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 45%,transparent),rgba(18,9,34,.7));box-shadow:0 0 16px color-mix(in srgb,var(--c) 55%,transparent)}
/* Controls */
.ctrl{position:fixed;right:10px;bottom:calc(140px + var(--sb));display:flex;flex-direction:column;gap:8px;z-index:3}
.fab{width:42px;height:42px;border-radius:14px;color:#fff;font-size:17px;font-weight:800;cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.fab:active{transform:scale(.94)}
.hint{position:fixed;left:50%;top:calc(170px + var(--st));transform:translateX(-50%);z-index:4;padding:9px 14px;border-radius:99px;font-size:12px;font-weight:700;color:#fff;
  background:linear-gradient(90deg,var(--pink),var(--violet));box-shadow:0 0 24px rgba(255,46,136,.6);display:none;white-space:nowrap}
.add .hint{display:block;animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 40px rgba(255,46,136,.9)}}
.helpbox{position:fixed;left:12px;bottom:calc(150px + var(--sb));z-index:3;font-size:11px;line-height:1.45;padding:8px 10px;border-radius:12px;pointer-events:none;transition:opacity .8s;color:#e9defc}
/* Bottom */
.adbar{position:fixed;left:10px;right:10px;bottom:calc(84px + var(--sb));height:44px;border-radius:14px;z-index:3;display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;color:var(--muted);
  background:repeating-linear-gradient(45deg,rgba(20,10,36,.75),rgba(20,10,36,.75) 9px,rgba(30,16,52,.75) 9px,rgba(30,16,52,.75) 18px);border:1px dashed rgba(255,255,255,.18)}
.nav{position:fixed;left:10px;right:10px;bottom:calc(10px + var(--sb));height:66px;border-radius:22px;z-index:3;display:flex;align-items:center;justify-content:space-around;padding:0 6px;box-shadow:0 -6px 40px rgba(0,0,0,.4)}
.nb{flex:1;height:54px;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:700;letter-spacing:.3px;cursor:pointer;border-radius:16px;position:relative}
.nb i{font-style:normal;font-size:20px;line-height:1}
.nb.on{color:#fff}.nb.on i{filter:drop-shadow(0 0 8px var(--pink))}
.nb .badge{position:absolute;top:4px;right:calc(50% - 22px);min-width:17px;height:17px;border-radius:9px;background:var(--pink);color:#fff;font-size:10px;display:none;place-items:center;padding:0 4px;box-shadow:0 0 10px var(--pink)}
.nb.main{flex:none;width:62px;height:62px;margin-top:-30px;border-radius:21px;color:#fff;font-size:30px;font-weight:400;
  background:linear-gradient(135deg,var(--orange),var(--pink) 50%,var(--violet));box-shadow:0 0 0 4px #12081f,0 0 28px rgba(255,46,136,.75)}
.nb.main.on{background:linear-gradient(135deg,#3dff9a,var(--cyan));box-shadow:0 0 0 4px #12081f,0 0 28px rgba(0,229,255,.8)}
/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(5,2,12,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:8}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;max-height:86%;overflow:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(22px + var(--sb));
  background:linear-gradient(180deg,rgba(32,16,58,.96),rgba(14,7,26,.98));border-top:1px solid rgba(255,46,136,.45);box-shadow:0 -10px 60px rgba(255,46,136,.18);
  transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.25,1)}
.sheet.show{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:rgba(255,255,255,.18);margin:0 auto 14px}
.sheet h2{font-family:"Bebas Neue",sans-serif;font-size:30px;letter-spacing:.8px;line-height:1;margin-bottom:8px}
.sheet h3{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--cyan);margin:14px 0 6px;font-weight:800}
.sheet p{font-size:14px;line-height:1.6;color:#e6dcf5;margin-bottom:10px}
.sheet p b{color:#fff}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tag{font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid var(--edge)}
.tag.warn{background:rgba(255,184,0,.14);border-color:rgba(255,184,0,.35);color:#ffd36e}
.tag.ok{background:rgba(61,255,154,.12);border-color:rgba(61,255,154,.35);color:#7dffbc}
.tag.comm{background:rgba(0,229,255,.12);border-color:rgba(0,229,255,.35);color:#7cf1ff}
.src{font-size:11px;color:var(--muted);margin:4px 0 12px}
.row{display:flex;gap:8px}
.btn{flex:1;min-height:46px;border-radius:14px;border:1px solid var(--edge);font-size:14px;font-weight:800;cursor:pointer;color:#fff;background:rgba(255,255,255,.07);padding:0 14px;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.primary{border:0;background:linear-gradient(95deg,var(--orange),var(--pink) 55%,var(--violet));box-shadow:0 0 22px rgba(255,46,136,.45)}
.btn.done{border:0;background:linear-gradient(95deg,#1fbf75,#00b3c7);box-shadow:0 0 18px rgba(31,191,117,.4)}
.btn.danger{flex:0 0 auto;background:rgba(255,60,90,.12);border-color:rgba(255,60,90,.35);color:#ff8fa3}
.btn.small{min-height:38px;font-size:12px}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 5px}
.field{width:100%;border-radius:12px;border:1px solid var(--edge);background:rgba(0,0,0,.35);color:var(--text);padding:11px 12px;font-size:14px;font-family:inherit;outline:none}
.field:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,46,136,.18)}
textarea.field{min-height:76px;resize:vertical}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:#e6dcf5;margin:8px 0 10px;font-weight:600}
.check input{width:18px;height:18px;accent-color:var(--pink)}
.small{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.55}
.veh{border-radius:14px;padding:11px 13px;margin:6px 0 12px;background:linear-gradient(135deg,rgba(0,229,255,.10),rgba(139,92,246,.10));border:1px solid rgba(0,229,255,.25)}
.vrow{font-size:13px;line-height:1.55;padding:2px 0}
.cm{border-radius:14px;padding:10px 12px;margin-bottom:8px;background:rgba(255,255,255,.05);border:1px solid var(--edge)}
.cm .who{font-size:12px;font-weight:800;color:#fff;display:flex;gap:6px;align-items:center}
.cm .who span{font-weight:500;color:var(--muted)}
.cm .tx{font-size:13px;line-height:1.5;color:#e6dcf5;margin-top:4px;white-space:pre-wrap;word-break:break-word}
.cm .del{margin-left:auto;background:none;border:0;color:#ff8fa3;font-size:12px;cursor:pointer;font-weight:700}
.empty{font-size:13px;color:var(--muted);padding:6px 0 10px}
.status{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:11px 13px;margin-bottom:10px;font-size:12.5px;line-height:1.5;background:rgba(255,255,255,.05);border:1px solid var(--edge)}
.list .grp{font-size:12px;font-weight:800;margin:16px 0 7px;color:var(--c);letter-spacing:.04em;text-transform:uppercase}
.list button{display:flex;width:100%;align-items:center;gap:10px;text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--edge);color:var(--text);border-radius:13px;padding:11px 12px;margin-bottom:7px;font-size:14px;font-weight:600;cursor:pointer}
.list button small{display:block;color:var(--muted);font-size:11px;margin-top:3px;font-weight:500}
.list button .ck{margin-left:auto;color:#3dff9a;font-weight:800}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c);box-shadow:0 0 8px var(--c)}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
@keyframes glowp{0%,100%{box-shadow:0 0 0 4px #12081f,0 0 22px rgba(255,46,136,.6)}50%{box-shadow:0 0 0 4px #12081f,0 0 42px rgba(255,46,136,1),0 0 70px rgba(139,92,246,.6)}}
@keyframes shimmer{0%{background-position:-160% 0}100%{background-position:260% 0}}
.fab{border:1.5px solid transparent!important;background:linear-gradient(rgba(18,9,34,.78),rgba(18,9,34,.78)) padding-box,conic-gradient(from var(--a),#ff2e88,#00e5ff,#8b5cf6,#ff8a3d,#ff2e88) border-box!important;animation:spin 6s linear infinite}
.fab.on{background:linear-gradient(135deg,rgba(0,229,255,.35),rgba(139,92,246,.35)) padding-box,conic-gradient(from var(--a),#00e5ff,#3dff9a,#00e5ff) border-box!important;box-shadow:0 0 22px rgba(0,229,255,.6)}
.nb.main{animation:glowp 2.4s ease-in-out infinite}
.nb.main::before{content:"";position:absolute;inset:-6px;border-radius:25px;padding:2px;background:conic-gradient(from var(--a),transparent 0 70%,#fff 80%,transparent 90%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 2.2s linear infinite;pointer-events:none}
.btn.primary{background:linear-gradient(95deg,var(--orange),var(--pink) 30%,var(--violet) 60%,var(--pink) 80%,var(--orange));background-size:220% 100%;animation:shimmer 3.5s linear infinite}
.btn,.fab,.nb,.chip{position:relative;overflow:hidden}
.nb.main{overflow:visible}
.ripple{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,46,136,.25) 40%,transparent 70%);transform:scale(0);animation:rip .55s ease-out forwards}
@keyframes rip{to{transform:scale(4);opacity:0}}
.chip.on::after{content:"";position:absolute;left:14%;right:14%;bottom:2px;height:2px;border-radius:2px;background:var(--c);box-shadow:0 0 8px var(--c)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 10px}
.bdg{border-radius:14px;padding:10px 6px;text-align:center;font-size:11px;font-weight:700;background:rgba(255,255,255,.04);border:1px solid var(--edge);color:var(--muted);filter:grayscale(1);opacity:.55}
.bdg i{display:block;font-style:normal;font-size:26px;margin-bottom:4px}
.bdg.on{filter:none;opacity:1;color:#fff;border-color:rgba(255,211,110,.5);background:linear-gradient(135deg,rgba(255,138,61,.18),rgba(139,92,246,.18));box-shadow:0 0 16px rgba(255,138,61,.25)}
.lb{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--edge);margin-bottom:6px;font-size:13px;font-weight:700}
.lb b{margin-left:auto;color:var(--cyan)}
.conf{position:fixed;width:9px;height:14px;z-index:40;pointer-events:none;border-radius:2px;animation:fall 1.6s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot));opacity:.2}}
.rstop{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--edge);margin-bottom:6px;font-size:13px;font-weight:700}
.rstop .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--violet));font-size:12px;flex:none;box-shadow:0 0 10px rgba(0,229,255,.6)}
.rstop button{margin-left:auto;background:none;border:0;color:#ff8fa3;font-weight:800;cursor:pointer}
.photo img{width:100%;border-radius:14px;margin:4px 0 10px;display:block;border:1px solid var(--edge)}
.photo{font-size:12px;color:var(--muted);margin:4px 0 8px}
.imgprev{max-width:100%;max-height:180px;border-radius:12px;margin-top:8px;display:none}
.chal{border-radius:16px;padding:12px 14px;margin:4px 0 12px;background:linear-gradient(135deg,rgba(255,138,61,.16),rgba(255,46,136,.14),rgba(139,92,246,.16));border:1px solid rgba(255,138,61,.4)}
.chal .bar{height:8px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin:8px 0 4px}
.chal .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--pink));box-shadow:0 0 12px var(--pink)}
.lang{font-size:11px;font-weight:800;letter-spacing:.06em;cursor:pointer}
.nav2{border-radius:14px;padding:11px 13px;margin:4px 0 12px;background:linear-gradient(135deg,rgba(61,255,154,.10),rgba(0,229,255,.10));border:1px solid rgba(61,255,154,.3)}
.nav2 .vrow b{color:#fff}
.grid-code{font-family:"Bebas Neue",sans-serif;font-size:22px;letter-spacing:1px;color:var(--cyan);text-shadow:0 0 10px rgba(0,229,255,.7)}
body.video .top,body.video .chips,body.video .ctrl,body.video .adbar,body.video .nav,body.video .helpbox,body.video .hint{opacity:0;pointer-events:none;transition:opacity .4s}
.wm{position:fixed;left:50%;bottom:calc(28px + var(--sb));transform:translateX(-50%);z-index:5;display:none;font-family:"Bebas Neue",sans-serif;font-size:26px;letter-spacing:2px;color:#fff;text-shadow:0 0 14px rgba(255,46,136,.9);pointer-events:none;white-space:nowrap}
body.video .wm{display:block}
.vexit{position:fixed;top:calc(14px + var(--st));right:14px;z-index:6;display:none}
body.video.showexit .vexit{display:grid}
.shareimg{width:100%;border-radius:16px;border:1px solid var(--edge);margin:4px 0 10px;display:block}
.code{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all;background:rgba(0,0,0,.35);border:1px solid var(--edge);border-radius:12px;padding:10px;user-select:all}
.qr{display:block;margin:8px auto;border-radius:12px;background:#fff;padding:8px;max-width:220px;width:70%}
.toast{position:fixed;left:50%;bottom:calc(160px + var(--sb));transform:translateX(-50%) translateY(20px);z-index:20;padding:10px 16px;border-radius:99px;font-size:13px;font-weight:700;color:#fff;
  background:rgba(18,9,34,.9);border:1px solid rgba(255,46,136,.5);box-shadow:0 0 22px rgba(255,46,136,.4);opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
.loading{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,#3a1250,#0b0616 70%);transition:opacity .6s}
.loading .logo{font-size:52px}
.loading .bar{width:160px;height:4px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.loading .bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--pink),var(--cyan));animation:ld 1s infinite ease-in-out}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
</style>
</head>
<body>
<div id="app">
<canvas id="c"></canvas>
<div class="top glass">
  <div class="brand">
    <div class="logo">LEONIDA FINDER<small>INOFFIZIELLE GTA-6-FAN-MAP</small></div>
    <div class="sp"></div>
    <div class="pill" id="progPill"><div class="ring" id="ring"></div><span id="progTxt">0/0</span></div>
    <div class="pill lang" id="langPill">DE</div>
    <div class="pill" id="livePill" title="Community-Status"><div class="live" id="liveDot"></div></div>
  </div>
  <div class="search"><input id="q" type="search" placeholder="Suche: UFO, Bigfoot, Penumbra, Key Lento …" autocomplete="off"></div>
</div>
<div class="chips" id="chips"></div>
<div class="hint">Tippe aufs Land, um deinen Fund zu markieren</div>
<div class="helpbox glass" id="helpbox">☝️ 1 Finger: verschieben<br>✌️ 2 Finger: zoomen &amp; drehen</div>
<div class="ctrl">
  <button class="fab glass" id="zin">＋</button>
  <button class="fab glass" id="zout">－</button>
  <button class="fab glass" id="tilt">2D</button>
  <button class="fab glass" id="mode" title="Tag/Nacht">🌙</button>
  <button class="fab glass" id="tour" title="Kamerafahrt">🎥</button>
  <button class="fab glass" id="routeBtn" title="Route">🧭</button>
  <button class="fab glass" id="gridBtn" title="Planquadrate">▦</button>
  <button class="fab glass" id="reset" title="Zurücksetzen">⤾</button>
</div>
<div class="adbar">📢 Werbefläche · Premium = werbefrei</div>
<nav class="nav glass">
  <button class="nb on" id="nMap"><i>🗺️</i>Karte</button>

  {id:"e2",cat:"geheim",x:-6,z:-1,name:"Skunk Ape (Bigfoot)",region:"Cottonmouth Lake, südlich von Hamlet, Grassrivers",how:"Nach der ersten Mission auf dem Feldweg südlich des Sees: Er frisst ein Reh und rennt in den Wald. Dort hängt eine Puppe im Baum – untersuchen, du wirst ohnmächtig und wachst am See auf. Flyer in ganz Leonida starten die Quest „Search for the Skunk Ape“ (nur nachts), Kirk hat dazu eine ganze Questreihe (Flyer gibt's z. B. in Skeeter's Bar in Hamlet). Weazel News berichtet im TV über Sichtungen. Manche Spieler sahen ihn auch zuerst in den Mangroven von Gullet Marsh.",src:"metaforge.app, leonidaverse.com, gtaside.com"},

  {id:"e7",cat:"geheim",x:-3,z:35,name:"Hund auf dem Jetski",region:"Offenes Meer, z. B. Gambit Bay",how:"Weit draußen im Meer stranden und nach Bellen lauschen. Ein Hund mit Schwimmweste bringt dich ans Ufer. Bleibst du drauf, fährt er zur Hunde-Insel und buddelt eine Geldbörse mit ca. 1.200 $ und eine Sonnenbrille aus. Zufallsbegegnung.",src:"leonidaverse.com, gtaside.com"},

const EN={
e1:["Real Easter egg on the radio tower","South Vice-Dale County","Climb the tallest radio tower via the ladders (about 6–7 minutes). At the top is a bird's nest with painted eggs. Grab one and throw it over the edge for a short, funny cutscene. Tip: throw it at full power."],
e2:["Skunk Ape (Bigfoot)","Cottonmouth Lake, south of Hamlet, Grassrivers","After the first mission, on the dirt road south of the lake: he's eating a deer, then runs into the woods. An effigy hangs in a tree – inspect it, you pass out and wake up by the lake. Flyers all over Leonida start the quest “Search for the Skunk Ape” (night only), and Kirk has a whole questline (flyers e.g. in Skeeter's Bar in Hamlet). Weazel News reports sightings on TV. Some players first saw him in the mangroves of Gullet Marsh."],
e3:["UFO abduction","Kelly County, by the Starlet Motel near Port Gellhorn","Only after Chapter 2, at night from about 2 a.m. A car with flashing lights stands by the road – follow the trail into the woods and help the woman. Back at her car, the UFO takes you. You wake up three days later and get the trophy “The Truth Is Out There”. Doesn't trigger every time."],
e4:["Secret research facility","Restricted area in southern Leonida","After the UFO abduction, keep sleeping until you wake up in the ship. A dream puzzle reveals the place. Enter code 2314 at the site and rescue the alien. Players report permanently more health, stamina and focus. Reported in south-east Pelican Valley near the Mariana County border – exact spot still disputed."],
e5:["The Belville house","Belville, Leonard County","The house from a photo in GTA San Andreas (Definitive Edition, 2021). Break into the garage: a conspiracy theorist hides there who believes Leonida is a video game – “IT'S A SIMULATION”."],
e6:["Dexter's apartment","Trinity Apartments, Washington Island, Vice City","You can't go in, but the roof has a tool kit Dexter fans will recognise instantly. At the jetty next to it is a boat that looks like his “Slice of Life”."],
e7:["Dog on a jet ski","Open sea, e.g. Gambit Bay","Get stranded far out at sea and listen for barking. A dog in a life jacket takes you to shore. Stay on and he rides to Dog Island and digs up a wallet with about $1,200 and sunglasses. Random encounter."],
e8:["Giant crab","Outpost in Gullet Marsh","Switch on the power at the breaker box outside, go in, read the journal on the computer, then look away from the screen. A nod to the “Giant Enemy Crab” meme."],
e9:["Monument of Leonidan Supremacy","Manifest Canyon, Kelly County","Still unsolved! Players report controller vibrations and beeps near the statue. You could be the first to crack it."],
e10:["Demon ritual","Warehouse in north Capri, near Tortoise Lake","In the unmarked warehouse there's a ritual circle on the floor. At night, lay an unconscious person on it."],
e11:["Talking parrots","Liquor store, Leonida Keys","Win the brawl, listen to the parrots, then collect cash at the generator next door."],
e12:["Michael's yacht from GTA 5","By Jason's house, Key Lento","Go on board and check the navigation screen – it shows the map of Los Santos."],
e13:["Pink meteorite","Mount Kalaga","South-east of the National Park text on the map, below a race marker. At a small campsite, the glowing rock sits in the crater."],
e14:["The Vault – secret radio station","The Vault nightclub, Downtown Vice City","South of Jack of Hearts, west of NINE1NINE. Go in, find the red poster at the entrance and scan it with the WAiNK app (R1 / RB). The station then plays in cars and on headphones – hosted by DJ Pretzel."],
e15:["“There's a snake in my boot!”","Trunk of the Penumbra FF, Vespucci Island","A big snake jumps out of the trunk of the Paul Walker car – a pun on Woody's line from Toy Story."],
e16:["Fog in the Marbelle Hotel (Silent Hill)","Abandoned hotel, south Crosstown, NW 8th Street, Vice City","Optional horror scene in the abandoned hotel. From the roof you then see Vice City in fog."],
e17:["Mario & Luigi caps","Lawton Co. Paper Mill ruins, Moreau","Jump into the floating block from below – you get a cap for each lead (J and L)."],
e18:["Backrooms trip","Excavation site north of Millport, by Lake Tallaloko","Use the item at the dig – Jason ends up in a weird Backrooms-style obstacle course."],
e19:["Tiny Arthur riding a chihuahua","Frontier Adventure Golf, south Waning Sands","A little cowboy figure that looks like Arthur Morgan rides a roaming chihuahua."],
e20:["The merman","Small island near the Shores Keys, north-east of Key Lento","A man in a turquoise mermaid tail is doing a photoshoot on the beach. He reacts if you disturb him."],
e21:["Skeeter's Bar","Waterside bar, south Hamlet","Flyers for the Skunk Ape quest hang here. Possibly a South Park nod (uncertain)."],
e22:["“ASS MAN” licence plate","Impound yard, Hamlet","On the red Imponte Phoenix – a nod to Kramer's licence plate from Seinfeld."],
e23:["RX-Men comic","24/7 store, Key Lento","On the magazine rack for $1.25 – an X-Men parody about the pharma industry."],
e24:["Love Fist sticker","Starlet Motel, Kelly County","A sticker of the band from GTA Vice City – right next to the UFO abduction spot."],
e25:["Western novel from Red Dead","Jacob's Tavern, Millport","Readable novel “The Cowboy's Prayer is to Die Young” about a cowboy in New Austin. Another copy is at Brian's marina."],
n1:["Michael's ringtone","Phone → Settings → Ringtone","“Wind Chimes” is Michael's ringtone from GTA 5."],
n2:["Cat in a stolen car","Anywhere – parked cars","Sometimes a cat sits in the car. It attacks the driver, and you throw it out of the window."],
n3:["Camilo and the trunk challenge","Trunk of a stolen car","A streamer lies in the trunk and keeps chatting with his chat during the chase."],
n4:["Red Hulk strawberries","Kyle's farm, around McKittrick Farm","Side quest: you help a farmer grow giant strawberries. He turns into a red monster. Eating a strawberry briefly boosts all stats."],
n5:["Escaped polar bear","Roads in Leonida (random event)","A polar bear escapes from a zoo truck. The outcome depends on an earlier hunter encounter."],
n6:["Mount Chiliad truck","Truck covered in conspiracy slogans","The truck carries the famous Mount Chiliad eye from GTA 5. Its QR code leads to the Rockstar website, but the in-game phone can't scan it."],
n7:["Mount Chiliad talk","Bar from the early Donnie and Brian mission","Outside, two customers talk about the Chiliad legend – including the jetpack rumour."],
n8:["Pet cemetery (Pet Sematary)","Woods in south Grayson, near SR-73","Hidden pet burial ground with creepy sounds."],
n9:["SpongeBob's pineapple bus stop","Cicada Avenue, near Bluegrass","A bus shelter shaped like SpongeBob's pineapple house."],
n10:["New Austin licence plates","Random traffic in Leonida","Some cars carry New Austin plates – the desert region from Red Dead Redemption."],
n11:["“In The Beginning” trophy","Ocean Beach, Vice City","Have a cocktail in Ocean Beach – a nod to GTA Vice City."],
v1:["Maibatsu '97 Penumbra FF (Paul Walker's car)","House on Neptune Circle, Vespucci Island","House behind the tall hedge, side door and garage. Switch off the alarm on the wall (or the police come) and take the green Eclipse replica from “The Fast and the Furious” – plate HAD YOU. No tracker, and Moses registers it for free. Possible early on.","The favourite free car for Moses. Easter egg: a snake lurks in the trunk!","1st registration free, otherwise approx. $6,750"],
v2:["Wyman's classic: Raita","North Key Lento","One of Wyman's classic junkers, parked in the north of Key Lento."],
v3:["Progen Royal Ruby Emerus","Vespucci Mansion, Neptune Circle, Vespucci Island","The red supercar sits in the small garage at the mansion's entrance – very close to the Penumbra FF.","Alarm off.",null,"approx. $33,000 (one source)"],
v4:["Bravado Copperheads Gauntlet","Reservoir Street, north-east Ambrosia","Blue-and-orange custom Gauntlet in a small riverside house."],
v5:["1932 Vapid Hustler","Rialto Islands, Vice City","Easy to miss: it sits behind a closed garage door."],
v6:["Übermacht Cypher Pop Art","Car park by Panos Plaza, Vice City","Comic-covered Cypher in the covered car park, right next to a plumber's van."],
v7:["Progen Purple Drank Emerus","Chatfield Storage & Logistics, Waxman Island","Purple supercar in a shipping container by the water – sometimes it's parked in front of the containers. Waxman Island is east of Downtown Vice City."],
v8:["Pfister Class Act Comet","South-west Starfish Island","In the corner of a mansion driveway, in front of two garage doors."],

const ptrs=new Map();let start=null,moved=false,last2=null,btn=0;

  if(!fpsChecked){if(!fpsT)fpsT=t;fpsN++;if(t-fpsT>4000){const fps=fpsN*1000/(t-fpsT);fpsChecked=true;if(fps<28){lite=true;store.set("lk5_lite",true);applyLite();toast(L("Sparmodus an – läuft jetzt flüssiger ⚡","Lite mode on – runs smoother now ⚡"))}}}
